    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #555555; /* 深灰色高级背景 */
            color: #ffffff;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* 顶部导航栏（深色背景适配） */
        .navbar {
            position: relative;
            width: 100%;
            height: 90px; 
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .nav-container {
            width: 100%;
            max-width: 1500px;
            height: 100%;
            padding: 0 clamp(20px, 3vw, 60px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0; 
            background-color: rgba(60, 60, 60, 0.96); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: height 0.3s ease;
            z-index: -1; 
        }

        .navbar:has(.has-dropdown:hover)::before {
            height: 165px; 
        }

        .logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .real-logo {
            height: 40px;
            object-fit: contain;
            filter: brightness(10); 
            transition: filter 0.3s ease;
        }

        .nav-links {
            display: flex;
            gap: clamp(10px, 1.8vw, 35px);
            align-items: center;
            height: 100%;
            flex-shrink: 0;
        }

        .nav-item {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .nav-item > a {
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #ffffff;
            font-size: clamp(12px, 1vw, 15px);
            white-space: nowrap;
            opacity: 0.9;
            transition: color 0.3s ease;
        }

        .navbar:has(.has-dropdown:hover) .nav-item > a {
            color: #dddddd;
            opacity: 1;
        }

        .navbar:has(.has-dropdown:hover) .nav-item > a:hover {
            color: #ffffff;
        }

        .arrow {
            font-size: 11px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .has-dropdown:hover .arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 75px; 
            left: 0; 
            min-width: 160px;
            width: max-content; 
            display: flex;
            flex-direction: column;
            gap: 10px; 
            padding-top: 5px; 
            background-color: transparent; 
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }

        .has-dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-menu a {
            display: block;
            padding: 0; 
            color: #cccccc !important; 
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
            line-height: 1.2; 
            transition: color 0.2s ease;
        }

        .dropdown-menu a:hover {
            color: #ffffff !important; 
        }

        .lang-switch > a {
            display: flex !important;
            align-items: center !important;
            white-space: nowrap !important;
        }

        .lang-switch {
            margin-left: 5px;
        }

        /* 现有投资页面正文区 */
        .investments-content-section {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 60px 120px 60px;
        }

        .page-title {
            font-size: 42px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .intro-text {
            font-size: 16px;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 70px;
            letter-spacing: 0.5px;
        }

        /* 企业 Logo 卡片网格（4列布局，共33个） */
        .investments-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
        }

        .investment-card {
            background-color: #ffffff;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .investment-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .investment-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 底部 Footer 板块样式 */
        .footer-section {
            width: 100%;
            background-color: #444444;
            color: #ffffff;
            padding: 70px 0 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-container {
            width: 100%;
            max-width: 1550px;
            padding: 0 60px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .footer-logo-col img {
            height: 45px;
            object-fit: contain;
            filter: brightness(10);
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .footer-col h4 {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .footer-col a {
            color: #cccccc;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .footer-col a:hover {
            color: #ffffff;
        }

        .footer-divider {
            width: 100%;
            max-width: 1430px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 60px 0 30px 0;
        }

        .footer-bottom {
            width: 100%;
            max-width: 1550px;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;

        }

        .footer-bottom-links {

        }

        .footer-bottom-links a {
            color: #aaaaaa;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-bottom-links a:hover {
            color: #ffffff;
        }
    </style>

<script>
    // 1. 禁用右键菜单
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault(); // 阻止默认的右键菜单弹出
    });

    // 2. 禁用 F12、Ctrl+Shift+I、Ctrl+Shift+C、Ctrl+U 等开发者快捷键
    document.addEventListener('keydown', function (e) {
        // 禁用 F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        // 禁用 Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (开发者工具)
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            return false;
        }
        // 禁用 Ctrl+U (查看网页源代码)
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
            return false;
        }
        // 禁用 Ctrl+S (保存网页)
        if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
            e.preventDefault();
            return false;
        }
    });

    // 3. 进阶：检测开发者工具是否打开（如果打开则尝试通过死循环或控制台警告阻止调试，不过这一项慎用，有时会误伤正常用户）
    setInterval(function() {
        const check = window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160;
        if (check) {
            document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;font-size:24px;color:#333;'>检测到开发者工具已打开，为了保护版权，页面已锁定！</div>";
        }
    }, 1000);
</script>
<script>
    function switchLang(lang) {
        const elements = document.querySelectorAll('[data-zh]');
        
        elements.forEach(el => {
            if (lang === 'en') {
                el.innerText = el.getAttribute('data-en');
            } else {
                el.innerText = el.getAttribute('data-zh');
            }
        });

        const langText = document.getElementById('langText');
        if (lang === 'en') {
            langText.innerText = 'EN';
        } else {
            langText.innerText = '中文';
        }
        
        localStorage.setItem('preferred_lang', lang);
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('preferred_lang') || 'zh';
        switchLang(savedLang);
    });

    document.addEventListener('wheel', function (event) {
        if (event.ctrlKey) {
            event.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('keydown', function (event) {
        if (event.ctrlKey && (event.key === '+' || event.key === '-' || event.key === '=' || event.key === '0')) {
            event.preventDefault();
        }
    });

    document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
    });
</script>
